[project]
name = "personal-assistant"
version = "0.1.0"
description = "A personal assistant on Telegram: tasks, reminders and daily briefings."
readme = "README.md"
authors = [
    { name = "Eren", email = "aerenonem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
